# 官网 + 许可证服务。主机 3011 对外（3000 meridian、3010 trend-top 已占用）。
# api 只在 compose 网络里，不映射到主机端口：外界只能经官网的 /api/* 访问。
services:
  www:
    image: caddy:2-alpine
    container_name: enclave-www
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3011:3011"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 整个目录挂进去：单文件挂载在文件被改写时会留在旧 inode 上，看到的是旧内容。
      # 站点文件都在 site/，所以 .env、Caddyfile、README 不会被当成静态资源发出去。
      - ./site:/site:ro

  api:
    # 先在 enclave 仓库里构建：docker build -t enclave-vendor:latest apps/vendor
    image: enclave-vendor:latest
    container_name: enclave-vendor
    restart: unless-stopped
    environment:
      PORT: "3012"
      ENCLAVE_DATA_DIR: /data
      ENCLAVE_ADMIN_TOKEN: ${ENCLAVE_ADMIN_TOKEN:?请先在 .env 里设置 ENCLAVE_ADMIN_TOKEN}
    volumes:
      - vendor-data:/data

volumes:
  vendor-data:
