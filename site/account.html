<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号 — Enclave</title>
  <meta name="description" content="注册 Enclave 账号，查看档位与已绑定设备。" />
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <main class="www-main">
    <section class="www-hero">
      <p class="www-overline">Account</p>
      <h1 id="title">账号</h1>
      <p class="www-lead" id="lead">正在读取账号状态…</p>
    </section>

    <section class="www-section">
      <div id="panel" class="www-card www-card-narrow"></div>
    </section>

    <section class="www-section" id="contact">
      <div class="www-section-head">
        <h2>联系我们</h2>
        <p>销售咨询、开通、安全披露都走这里</p>
      </div>
      <form class="www-form www-card www-card-narrow" id="contact-form">
        <div class="www-field">
          <label for="topic">主题</label>
          <select id="topic" name="topic">
            <option value="sales">销售 / 开通咨询</option>
            <option value="security">安全披露</option>
            <option value="support">使用问题</option>
          </select>
        </div>
        <div class="www-field">
          <label for="contact-email">你的邮箱</label>
          <input id="contact-email" name="email" type="email" required placeholder="you@company.com" />
        </div>
        <div class="www-field">
          <label for="message">内容</label>
          <textarea id="message" name="message" required minlength="5" maxlength="1000" rows="5" placeholder="请写清楚问题或需求"></textarea>
        </div>
        <p class="www-error" id="contact-error" hidden></p>
        <p class="www-ok" id="contact-ok" hidden>已收到，我们会用你填的邮箱回复。</p>
        <button class="www-btn www-btn-secondary" type="submit">提交</button>
      </form>
    </section>
  </main>

  <script src="js/site.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
